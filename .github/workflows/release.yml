name: Release
on:
  push:
    tags: ["v*.*.*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      BRANDKIT_NO_SANDBOX: "1"
      # Missing Chrome or Tailwind fails the browser tests instead of skipping them.
      BRANDKIT_REQUIRE_TOOLS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Versions agree
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          want=${VERSION#v}
          plugin=$(sed -n 's/^ *"version": *"\([^"]*\)".*/\1/p' agent-plugin/.claude-plugin/plugin.json)
          cli=$(sed -n 's/^var version = "\([^"]*\)"/\1/p' cmd/brandkit/main.go)
          if [ "$plugin" != "$want" ] || [ "$cli" != "$want" ]; then
            echo "tag $VERSION, but plugin.json says $plugin and main.go says $cli" >&2
            exit 1
          fi
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
      - name: Test
        run: go test ./...
      - name: Build
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          for target in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64; do
            os=${target%/*}; arch=${target#*/}
            name=brandkit_${VERSION#v}_${os}_${arch}
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.version=${VERSION#v}" -o "dist/$name/brandkit" ./cmd/brandkit
            tar -C "dist/$name" -czf "dist/$name.tar.gz" brandkit
          done
          (cd dist && sha256sum ./*.tar.gz | sed "s| ./| |" > checksums.txt)
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/checksums.txt --title "$GITHUB_REF_NAME" --generate-notes
